services:
  iris:
    build:
      context: .
      args:
        IMAGE: ${IRIS_IMAGE:-intersystemsdc/iris-community:latest-em}
    command: --check-caps false
    restart: unless-stopped
    ports:
      - "${IRIS_WEB_PORT:-52773}:52773"
      - "${IRIS_SUPERSERVER_PORT:-1972}:1972"
    volumes:
      - ./:/home/irisowner/dev
    healthcheck:
      test: ["CMD", "/irisHealth.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
