# Route all local development HTTP traffic through the Web Gateway.
CSPModulePath "${ISC_PACKAGE_INSTALLDIR}/bin/"
CSPConfigPath "${ISC_PACKAGE_INSTALLDIR}/bin/"

<Location />
  CSP On
</Location>

<Directory />
  Options MultiViews FollowSymLinks
  AllowOverride None
  Require all granted
  <FilesMatch "\.(log|ini|pid|exe|so)$">
    Require all denied
  </FilesMatch>
</Directory>

